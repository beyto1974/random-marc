<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>random-marc</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 0.9rem; gap: 0.25rem; }
  input, select { padding: 0.4rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  #status { margin-top: 1rem; font-size: 0.9rem; color: #555; }
  #status.error { color: #b00020; }
  pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; max-height: 24rem; }
  #download { display: none; margin-top: 1rem; }
</style>
</head>
<body>
<h1>random-marc</h1>
<p>Generate random bibliographic MARC21 records in the browser.</p>

<form id="form">
  <label>Count
    <input type="number" id="count" value="5" min="1" max="1000">
  </label>
  <label>Format
    <select id="format">
      <option value="mrc">mrc (binary MARC21)</option>
      <option value="json" selected>json</option>
      <option value="xml">xml</option>
      <option value="text">text</option>
    </select>
  </label>
  <label>Seed (optional)
    <input type="number" id="seed" placeholder="time-based">
  </label>
  <button type="submit">Generate</button>
</form>

<div id="status">Loading WebAssembly...</div>
<a id="download" download>Download</a>
<pre id="preview"></pre>

<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
